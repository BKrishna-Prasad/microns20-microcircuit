[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "microns20"
version = "0.1.0"
requires-python = ">=3.10"

dependencies = [
    "caveclient",
    "pandas",
    "numpy",
    "pyarrow",
    "h5py",
    "PyYAML",
    "scipy",
    "networkx",
    "matplotlib",
    "plotly",
    "morphio",
    "libsonata",
    "bmtk",
    "neuron",
    "bluepysnap"
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-p no:dandi"

